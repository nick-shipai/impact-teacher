<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Impact Academy Admin Login</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <div class="bg-glow glow-one"></div>
  <div class="bg-glow glow-two"></div>

  <main class="login-wrapper">
    <section class="login-card">

      <div class="brand">
        <div class="brand-icon">I</div>
        <div>
          <h1>IMPACTECH</h1>
          <p>ADMIN PANEL</p>
        </div>
      </div>

      <div class="login-title">
        <h2>Welcome back, Impact Admin 👋</h2>
        <p>Login to access the Impact Academy control center.</p>
      </div>

      <form id="adminLoginForm">
        <div class="input-box">
          <label>Username</label>
          <input type="text" id="username" placeholder="Enter admin username" autocomplete="off" />
        </div>

        <div class="input-box">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter admin password" />
        </div>

        <button type="submit" class="login-btn">
          Login To Admin Panel
          <span>→</span>
        </button>

        <p id="errorMessage" class="error-message"></p>
      </form>

    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
