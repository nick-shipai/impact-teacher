<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recent Activities - Impactech Admin</title>
  <link rel="stylesheet" href="/dashboard/admin-list.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
  <script>
    window.ADMIN_LIST_CONFIG = {
      title: "Recent Activities",
      subtitle: "Track new signups, job posts, and application activity for the selected time range.",
      endpoint: "/api/admin/activities",
      rowType: "activities",
      emptyTitle: "No activities found",
      emptyText: "Try switching the time range to surface more events.",
      defaultLimit: 200,
      filters: [
        {
          name: "filter",
          options: [
            { value: "today", label: "Today" },
            { value: "this_week", label: "This Week" },
            { value: "last_month", label: "Last Month" }
          ]
        }
      ],
      sortOptions: [
        { value: "newest", label: "Newest" }
      ]
    };
  </script>

  <main class="list-page">
    <header class="list-topbar">
      <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-i-cursor"></i></div>
        <div>
          <h2>IMPACTECH</h2>
          <span>ADMIN PANEL</span>
        </div>
      </div>

      <div class="top-actions">
        <a class="ghost-link" href="../"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
        <div class="admin-profile">
          <div class="avatar">IA</div>
          <div>
            <h4>Impact Admin</h4>
            <p>Super Admin</p>
          </div>
        </div>
      </div>
    </header>

    <section class="hero">
      <div>
        <h1 id="pageTitle">Recent Activities</h1>
        <p id="pageSubtitle"></p>
      </div>
      <div class="hero-badge" id="heroBadge">Recent Activities</div>
    </section>

    <section class="toolbar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="searchInput" class="search-input" type="text" placeholder="Search activities..." />
      </div>

      <div class="filters" id="filters"></div>

      <div id="sortWrap"></div>

      <button id="refreshBtn" class="refresh-btn" type="button"><i class="fa-solid fa-rotate"></i> Refresh</button>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h3>Activities</h3>
        <span id="recordCount">0 records</span>
      </div>

      <div id="loadingState" class="loading-state hidden">
        <i class="fa-solid fa-spinner fa-spin"></i>
        <h4>Loading activities...</h4>
        <p>Please wait while the admin list loads.</p>
      </div>

      <div id="emptyState" class="empty-state hidden">
        <i class="fa-regular fa-bell"></i>
        <h4 id="emptyTitle">No activities found</h4>
        <p id="emptyText">Try switching the time range to surface more events.</p>
      </div>

      <div id="tableWrap" class="table-wrap">
        <table>
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/dashboard/admin-list.js"></script>
</body>

</html>
