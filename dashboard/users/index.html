<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users - Impactech Admin</title>
  <link rel="stylesheet" href="/dashboard/admin-list.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
  <script>
    window.ADMIN_LIST_CONFIG = {
      title: "Users",
      subtitle: "Browse registered accounts, filter by role or status, and copy user IDs instantly.",
      endpoint: "/api/admin/users",
      rowType: "users",
      emptyTitle: "No users found",
      emptyText: "Try a different search term or filter.",
      defaultLimit: 200,
      filters: [
        {
          name: "role",
          options: [
            { value: "all", label: "All roles" },
            { value: "student", label: "Student" },
            { value: "freelancer", label: "Freelancer" },
            { value: "client", label: "Client" },
            { value: "admin", label: "Admin" }
          ]
        },
        {
          name: "status",
          options: [
            { value: "all", label: "All statuses" },
            { value: "active", label: "Active" },
            { value: "disabled", label: "Disabled" },
            { value: "blocked", label: "Blocked" }
          ]
        }
      ],
      sortOptions: [
        { value: "newest", label: "Newest" },
        { value: "oldest", label: "Oldest" },
        { value: "name", label: "Name" },
        { value: "email", label: "Email" }
      ]
    };
  </script>

  <main class="list-page">
    <header class="list-topbar">
      <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-i-cursor"></i></div>
        <div>
          <h2>IMPACTECH</h2>
          <span>ADMIN PANEL</span>
        </div>
      </div>

      <div class="top-actions">
        <a class="ghost-link" href="../"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
        <div class="admin-profile">
          <div class="avatar">IA</div>
          <div>
            <h4>Impact Admin</h4>
            <p>Super Admin</p>
          </div>
        </div>
      </div>
    </header>

    <section class="hero">
      <div>
        <h1 id="pageTitle">Users</h1>
        <p id="pageSubtitle"></p>
      </div>
      <div class="hero-badge" id="heroBadge">Users</div>
    </section>

    <section class="toolbar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="searchInput" class="search-input" type="text" placeholder="Search users..." />
      </div>

      <div class="filters" id="filters"></div>

      <div id="sortWrap"></div>

      <button id="refreshBtn" class="refresh-btn" type="button"><i class="fa-solid fa-rotate"></i> Refresh</button>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h3>Users</h3>
        <span id="recordCount">0 records</span>
      </div>

      <div id="loadingState" class="loading-state hidden">
        <i class="fa-solid fa-spinner fa-spin"></i>
        <h4>Loading users...</h4>
        <p>Please wait while the admin list loads.</p>
      </div>

      <div id="emptyState" class="empty-state hidden">
        <i class="fa-solid fa-users"></i>
        <h4 id="emptyTitle">No users found</h4>
        <p id="emptyText">Try a different search term or filter.</p>
      </div>

      <div id="tableWrap" class="table-wrap">
        <table>
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/dashboard/admin-list.js"></script>
</body>

</html>
